<div class="filter-group">
  <div class="search-box">
    <span class="material-symbols-outlined">search</span>
    <input type="text" placeholder="Tìm hệ thống nguồn" class="search-input"
      (input)="searchService.setQuery($any($event.target).value)">
    @if (searchService.searchQuery()) {
    <button class="btn-clear" (click)="searchService.clearQuery()">
      <span class="material-symbols-outlined">close</span>
    </button>
    }
  </div>
  <div class="filter-item">
    <span class="filter-label">Cơ sở:</span>
    <select [(ngModel)]="selectedFacilityId" (change)="onFacilityChange()" class="filter-select">
      <option [ngValue]="null">Tất cả cơ sở</option>
      @for (facility of facilities; track facility.id) {
      <option [ngValue]="facility.id">{{ facility.name }}</option>
      }
    </select>
  </div>

  <div class="filter-item">
    <span class="filter-label">Trạng thái:</span>
    <select [(ngModel)]="selectedStatus" (change)="onStatusChange()" class="filter-select">
      <option value="ALL">Tất cả</option>
      <option value="ACTIVE">Đang hoạt động</option>
      <option value="INACTIVE">Không hoạt động</option>
    </select>
  </div>

  <button class="btn-reset" (click)="onReset()" title="Làm mới bộ lọc">
    <span class="material-symbols-outlined">refresh</span>
  </button>

  <button class="btn-export">
    <span class="material-symbols-outlined">download</span>
    Xuất Excel
  </button>
</div>
