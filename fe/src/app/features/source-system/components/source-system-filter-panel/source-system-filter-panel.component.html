<div class="filter-group">
  <div class="search-box">
    <span class="material-symbols-outlined">search</span>
    <input type="text" placeholder="Tìm hệ thống nguồn" class="search-input"
      (input)="searchService.setQuery($any($event.target).value)">
    @if (searchService.searchQuery()) {
    <button class="btn-clear" (click)="searchService.clearQuery()">
      <span class="material-symbols-outlined">close</span>
    </button>
    }
  </div>
  <!-- Facility Filter -->
  <div class="filter-dropdown" [class.open]="facilityDropdownOpen">
    <button class="filter-trigger" (click)="toggleFacilityDropdown($event)">
      <span class="material-symbols-outlined filter-icon">apartment</span>
      <span class="filter-label">Cơ sở:</span>
      <span class="filter-value">{{ getFacilityLabel() }}</span>
      <span class="material-symbols-outlined arrow">expand_more</span>
    </button>
    <div class="filter-menu" *ngIf="facilityDropdownOpen">
      <div class="filter-menu-item"
           [class.selected]="selectedFacilityId === null"
           (click)="selectFacility(null)">
        <span class="material-symbols-outlined item-icon">apps</span>
        <span class="item-label">Tất cả cơ sở</span>
        <span class="material-symbols-outlined check-icon" *ngIf="selectedFacilityId === null">check</span>
      </div>
      <div class="filter-menu-item"
           *ngFor="let facility of facilities"
           [class.selected]="selectedFacilityId === facility.id"
           (click)="selectFacility(facility.id)">
        <span class="material-symbols-outlined item-icon">local_hospital</span>
        <span class="item-label">{{ facility.name }}</span>
        <span class="material-symbols-outlined check-icon" *ngIf="selectedFacilityId === facility.id">check</span>
      </div>
    </div>
  </div>

  <!-- Status Filter -->
  <div class="filter-dropdown" [class.open]="statusDropdownOpen">
    <button class="filter-trigger" (click)="toggleStatusDropdown($event)">
      <span class="material-symbols-outlined filter-icon">toggle_on</span>
      <span class="filter-label">Trạng thái:</span>
      <span class="filter-value">{{ getStatusLabel() }}</span>
      <span class="material-symbols-outlined arrow">expand_more</span>
    </button>
    <div class="filter-menu" *ngIf="statusDropdownOpen">
      <div class="filter-menu-item"
           *ngFor="let status of statusOptions"
           [class.selected]="selectedStatus === status.value"
           (click)="selectStatus(status.value)">
        <span class="material-symbols-outlined item-icon">{{ getStatusIcon(status.value) }}</span>
        <span class="item-label">{{ status.label }}</span>
        <span class="material-symbols-outlined check-icon" *ngIf="selectedStatus === status.value">check</span>
      </div>
    </div>
  </div>

  <button class="btn-reset" (click)="onReset()" title="Làm mới bộ lọc">
    <span class="material-symbols-outlined">refresh</span>
  </button>

  <button class="btn-export">
    <span class="material-symbols-outlined">download</span>
    Xuất Excel
  </button>
</div>
