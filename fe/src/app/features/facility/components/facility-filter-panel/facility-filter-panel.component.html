<div class="filter-group">
  <div class="search-box">
    <span class="material-symbols-outlined">search</span>
    <input type="text" placeholder="Tìm cơ sở y tế" class="search-input"
      (input)="searchService.setQuery($any($event.target).value)">
    @if (searchService.searchQuery()) {
    <button class="btn-clear" (click)="searchService.clearQuery()">
      <span class="material-symbols-outlined">close</span>
    </button>
    }
  </div>
  <div class="filter-item">
    <span class="filter-label">Loại hình:</span>
    <select [(ngModel)]="selectedType" (change)="onTypeChange()" class="filter-select">
      @for (type of facilityTypeOptions; track type.value) {
      <option [value]="type.value">{{ type.label }}</option>
      }
    </select>
  </div>

  <div class="filter-item">
    <span class="filter-label">Trạng thái:</span>
    <select [(ngModel)]="selectedStatus" (change)="onStatusChange()" class="filter-select">
      <option value="ALL">Tất cả</option>
      <option value="ACTIVE">Đang hoạt động</option>
      <option value="INACTIVE">Ngừng hoạt động</option>
    </select>
  </div>

  <button class="btn-reset" (click)="onReset()" title="Làm mới bộ lọc">
    <span class="material-symbols-outlined">refresh</span>
  </button>

  <button class="btn-export">
    <span class="material-symbols-outlined">download</span>
    Xuất Excel
  </button>
</div>
