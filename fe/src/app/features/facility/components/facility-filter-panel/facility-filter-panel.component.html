<div class="filter-group">
  <div class="search-box">
    <span class="material-symbols-outlined">search</span>
    <input type="text" placeholder="Tìm cơ sở y tế" class="search-input"
      (input)="searchService.setQuery($any($event.target).value)">
    @if (searchService.searchQuery()) {
    <button class="btn-clear" (click)="searchService.clearQuery()">
      <span class="material-symbols-outlined">close</span>
    </button>
    }
  </div>
  <!-- Facility Type Filter -->
  <div class="filter-dropdown" [class.open]="typeDropdownOpen">
    <button class="filter-trigger" (click)="toggleTypeDropdown($event)">
      <span class="material-symbols-outlined filter-icon">category</span>
      <span class="filter-label">Loại hình:</span>
      <span class="filter-value">{{ getTypeLabel() }}</span>
      <span class="material-symbols-outlined arrow">expand_more</span>
    </button>
    <div class="filter-menu" *ngIf="typeDropdownOpen">
      <div class="filter-menu-item"
           *ngFor="let type of facilityTypeOptions"
           [class.selected]="selectedType === type.value"
           (click)="selectType(type.value)">
        <span class="material-symbols-outlined item-icon">{{ getTypeIcon(type.value) }}</span>
        <span class="item-label">{{ type.label }}</span>
        <span class="material-symbols-outlined check-icon" *ngIf="selectedType === type.value">check</span>
      </div>
    </div>
  </div>

  <!-- Status Filter -->
  <div class="filter-dropdown" [class.open]="statusDropdownOpen">
    <button class="filter-trigger" (click)="toggleStatusDropdown($event)">
      <span class="material-symbols-outlined filter-icon">toggle_on</span>
      <span class="filter-label">Trạng thái:</span>
      <span class="filter-value">{{ getStatusLabel() }}</span>
      <span class="material-symbols-outlined arrow">expand_more</span>
    </button>
    <div class="filter-menu" *ngIf="statusDropdownOpen">
      <div class="filter-menu-item"
           *ngFor="let status of statusOptions"
           [class.selected]="selectedStatus === status.value"
           (click)="selectStatus(status.value)">
        <span class="material-symbols-outlined item-icon">{{ getStatusIcon(status.value) }}</span>
        <span class="item-label">{{ status.label }}</span>
        <span class="material-symbols-outlined check-icon" *ngIf="selectedStatus === status.value">check</span>
      </div>
    </div>
  </div>

  <button class="btn-reset" (click)="onReset()" title="Làm mới bộ lọc">
    <span class="material-symbols-outlined">refresh</span>
  </button>

  <button class="btn-export">
    <span class="material-symbols-outlined">download</span>
    Xuất Excel
  </button>
</div>
