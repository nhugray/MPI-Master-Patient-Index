<div class="filter-group">
  <div class="search-box">
    <span class="material-symbols-outlined">search</span>
    <input type="text" placeholder="Tìm bệnh nhân" class="search-input"
      (input)="searchService.setQuery($any($event.target).value)">
    @if (searchService.searchQuery()) {
    <button class="btn-clear" (click)="searchService.clearQuery()">
      <span class="material-symbols-outlined">close</span>
    </button>
    }
  </div>
  <!-- Gender Filter -->
  <div class="filter-dropdown" [class.open]="genderDropdownOpen">
    <button class="filter-trigger" (click)="toggleGenderDropdown($event)">
      <span class="material-symbols-outlined filter-icon">person</span>
      <span class="filter-label">Giới tính:</span>
      <span class="filter-value">{{ getGenderLabel() }}</span>
      <span class="material-symbols-outlined arrow">expand_more</span>
    </button>
    <div class="filter-menu" *ngIf="genderDropdownOpen">
      <div class="filter-menu-item"
           *ngFor="let gender of genderOptions"
           [class.selected]="selectedGender === gender.value"
           (click)="selectGender(gender.value)">
        <span class="material-symbols-outlined item-icon">{{ getGenderIcon(gender.value) }}</span>
        <span class="item-label">{{ gender.label }}</span>
        <span class="material-symbols-outlined check-icon" *ngIf="selectedGender === gender.value">check</span>
      </div>
    </div>
  </div>

  <!-- Match Status Filter -->
  <div class="filter-dropdown" [class.open]="statusDropdownOpen">
    <button class="filter-trigger" (click)="toggleStatusDropdown($event)">
      <span class="material-symbols-outlined filter-icon">task_alt</span>
      <span class="filter-label">Trạng thái:</span>
      <span class="filter-value">{{ getStatusLabel() }}</span>
      <span class="material-symbols-outlined arrow">expand_more</span>
    </button>
    <div class="filter-menu" *ngIf="statusDropdownOpen">
      <div class="filter-menu-item"
           *ngFor="let status of matchStatusOptions"
           [class.selected]="selectedMatchStatus === status.value"
           (click)="selectStatus(status.value)">
        <span class="material-symbols-outlined item-icon">{{ getStatusIcon(status.value) }}</span>
        <span class="item-label">{{ status.label }}</span>
        <span class="material-symbols-outlined check-icon" *ngIf="selectedMatchStatus === status.value">check</span>
      </div>
    </div>
  </div>

  <!-- Source System Filter -->
  <div class="filter-dropdown" [class.open]="sourceDropdownOpen">
    <button class="filter-trigger" (click)="toggleSourceDropdown($event)">
      <span class="material-symbols-outlined filter-icon">dns</span>
      <span class="filter-label">Hệ thống nguồn:</span>
      <span class="filter-value">{{ getSourceLabel() }}</span>
      <span class="material-symbols-outlined arrow">expand_more</span>
    </button>
    <div class="filter-menu" *ngIf="sourceDropdownOpen">
      <div class="filter-menu-item"
           *ngFor="let system of sourceSystems"
           [class.selected]="selectedSourceSystemId === system.id"
           (click)="selectSource(system.id)">
        <span class="material-symbols-outlined item-icon">database</span>
        <span class="item-label">{{ system.facilityName }} - {{ system.name }}</span>
        <span class="material-symbols-outlined check-icon" *ngIf="selectedSourceSystemId === system.id">check</span>
      </div>
    </div>
  </div>

  <button class="btn-reset" (click)="onReset()" title="Làm mới bộ lọc">
    <span class="material-symbols-outlined">refresh</span>
  </button>

  <button class="btn-export">
    <span class="material-symbols-outlined">download</span>
    Xuất Excel
  </button>
</div>
